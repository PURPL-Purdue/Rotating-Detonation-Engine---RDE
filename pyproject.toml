[project]
name = "rde"
version = "0.1.0"
description = "PURPL rotating detonation engine design and analysis tools (HADES, DEIMOS, modeling)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "CoolProp>=6.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rdelib*", "HADES*", "DEIMOS*", "MODELING*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
